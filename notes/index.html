<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Keep Notes App | Nikita Jha</title>
  <meta name="description" content="A Google Keep / Notes web app built by Nikita Jha, featuring real-time note creation, color styling, and local storage persistence.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <!-- App Header -->
  <header class="keep-header">
    <div class="header-left">
      <div class="keep-logo-icon">
        <i class="fa-regular fa-lightbulb"></i>
      </div>
      <h1 class="keep-title">Keep <span>Notes</span></h1>
    </div>

    <div class="header-right">
      <a href="https://github.com/nikitajha-2511/to-do-list" target="_blank" rel="noopener noreferrer" class="btn-repo" title="View GitHub Repository">
        <i class="fa-brands fa-github"></i> GitHub Repo
      </a>
      <a href="../#projects" class="btn-back-portfolio">
        <i class="fa-solid fa-arrow-left"></i> Back to Portfolio
      </a>
    </div>
  </header>

  <!-- Main Container -->
  <main class="app-container">
    <!-- Note Creation Form -->
    <div class="create-area-wrapper">
      <form class="create-form" id="createForm">
        <input type="text" id="noteTitle" class="note-input-title" placeholder="Title" autocomplete="off">
        <textarea id="noteContent" class="note-input-content" placeholder="Take a note..." required></textarea>

        <div class="create-form-actions">
          <div class="color-picker" title="Pick note color">
            <span class="color-dot active" data-color="#ffffff" style="background: #ffffff;"></span>
            <span class="color-dot" data-color="#fff8e1" style="background: #fff8e1;"></span>
            <span class="color-dot" data-color="#e8f0fe" style="background: #e8f0fe;"></span>
            <span class="color-dot" data-color="#e6f4ea" style="background: #e6f4ea;"></span>
            <span class="color-dot" data-color="#fce8e6" style="background: #fce8e6;"></span>
            <span class="color-dot" data-color="#f3e8fd" style="background: #f3e8fd;"></span>
          </div>
        </div>

        <button type="submit" class="btn-add-note" id="btnAddNote" title="Add Note">
          <i class="fa-solid fa-plus"></i>
        </button>
      </form>
    </div>

    <!-- Notes Grid Section -->
    <div class="notes-section-title">
      <i class="fa-regular fa-bookmark"></i> Pinned & Active Notes
    </div>

    <div class="notes-grid" id="notesGrid">
      <!-- Dynamically generated notes -->
    </div>

    <!-- Empty State -->
    <div class="empty-state" id="emptyState" style="display: none;">
      <i class="fa-regular fa-lightbulb"></i>
      <p>Notes you add appear here</p>
    </div>
  </main>

  <!-- App Footer -->
  <footer class="keep-footer">
    <p>Google Keep Notes Feature • Built with React & JavaScript by <a href="../">Nikita Jha</a></p>
  </footer>

  <!-- Script -->
  <script src="./app.js"></script>
</body>

</html>
